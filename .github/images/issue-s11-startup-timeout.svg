<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1300" height="560" fill="#ffffff"/>
  <text x="650" y="64" text-anchor="middle" font-size="44" font-weight="800" fill="#111111">Server startup: two timers that disagree</text>
  <text x="650" y="104" text-anchor="middle" font-size="22" fill="#555555">docker-entrypoint.sh line 220 runs start-hugegraph.sh -t 120; the chart's startupProbe allows 450s</text>

  <text x="150" y="170" font-size="22" font-weight="700" fill="#1a5fd6">chart startupProbe budget</text>
  <text x="150" y="196" font-size="18" fill="#444444">failureThreshold 90 x periodSeconds 5 = 450s</text>
  <rect x="150" y="212" width="1000" height="34" rx="6" fill="#dbe6fb" stroke="#2a67d8" stroke-width="2.5"/>

  <text x="150" y="292" font-size="22" font-weight="700" fill="#c8341f">image entrypoint timeout</text>
  <text x="150" y="318" font-size="18" fill="#444444">-t 120 sets SERVER_STARTUP_TIMEOUT_S (script default is 30)</text>
  <rect x="150" y="334" width="266.7" height="34" rx="6" fill="#f7d3cc" stroke="#d0432c" stroke-width="2.5"/>
  <rect x="416.7" y="334" width="733.3" height="34" rx="6" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="783" y="358" text-anchor="middle" font-size="18" fill="#777777">330s of budget the process never lives to use</text>

  <line x1="416.7" y1="200" x2="416.7" y2="400" stroke="#c8341f" stroke-width="3"/>
  <polygon points="416.7,412 408,398 425.4,398" fill="#c8341f"/>
  <text x="430" y="392" font-size="20" font-weight="700" fill="#c8341f">container exits 1 here</text>

  <line x1="150" y1="440" x2="1150" y2="440" stroke="#333333" stroke-width="2"/>
  <line x1="150" y1="432" x2="150" y2="448" stroke="#333333" stroke-width="2"/>
  <line x1="416.7" y1="432" x2="416.7" y2="448" stroke="#333333" stroke-width="2"/>
  <line x1="1150" y1="432" x2="1150" y2="448" stroke="#333333" stroke-width="2"/>
  <text x="150" y="472" text-anchor="middle" font-size="18" fill="#333333">0s</text>
  <text x="416.7" y="472" text-anchor="middle" font-size="18" fill="#333333">120s</text>
  <text x="1150" y="472" text-anchor="middle" font-size="18" fill="#333333">450s</text>

  <rect x="200" y="498" width="900" height="42" rx="8" fill="#e6f6e8" stroke="#2c9a45" stroke-width="2.5"/>
  <text x="650" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#1f5f2f">Ask: read the timeout from an environment variable, default 120</text>
</svg>
