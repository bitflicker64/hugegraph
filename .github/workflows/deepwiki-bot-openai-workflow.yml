name: DeepWiki Issue Bot (OpenAI)

on:
  issues:
    types: [opened]

jobs:
  answer-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Answer issue with DeepWiki + OpenAI
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO_OWNER: apache
          REPO_NAME: incubator-hugegraph
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const issueTitle  = context.payload.issue.title;
            const issueBody   = context.payload.issue.body || '';
            const repoOwner   = process.env.REPO_OWNER;
            const repoName    = process.env.REPO_NAME;

            console.log(`Processing issue #${issueNumber}: ${issueTitle}`);

            // ── 1. Ask DeepWiki MCP ─────────────────────────────────────────
            async function askDeepWiki(owner, repo, question) {
              const url = 'https://mcp.deepwiki.com/mcp';

              const initRes = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json, text/event-stream'
                },
                body: JSON.stringify({
                  jsonrpc: '2.0',
                  id: 1,
                  method: 'initialize',
                  params: {
                    protocolVersion: '2024-11-05',
                    capabilities: {},
                    clientInfo: { name: 'deepwiki-bot', version: '1.0.0' }
                  }
                })
              });

              if (!initRes.ok) {
                throw new Error(`DeepWiki init failed: ${initRes.status} ${await initRes.text()}`);
              }

              const sessionId = initRes.headers.get('mcp-session-id');
              const headers = {
                'Content-Type': 'application/json',
                'Accept': 'application/json, text/event-stream'
              };
              if (sessionId) headers['mcp-session-id'] = sessionId;

              const toolRes = await fetch(url, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  jsonrpc: '2.0',
                  id: 2,
                  method: 'tools/call',
                  params: {
                    name: 'ask_question',
                    arguments: { repoOwner: owner, repoName: repo, question }
                  }
                })
              });

              const toolData = await toolRes.json();
              console.log('DeepWiki raw response:', JSON.stringify(toolData, null, 2));

              if (toolData.error) {
                throw new Error(`DeepWiki error: ${JSON.stringify(toolData.error)}`);
              }

              const content = toolData.result?.content ?? [];
              return content.filter(c => c.type === 'text').map(c => c.text).join('\n');
            }

            // ── 2. Polish with Groq ─────────────────────────────────────────
            async function polishWithOpenAI(issueTitle, issueBody, deepwikiAnswer) {
              const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type':  'application/json',
                  'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: 'llama-3.3-70b-versatile',
                  max_tokens: 1024,
                  messages: [
                    {
                      role: 'system',
                      content: `You are a helpful, friendly GitHub bot for the ${repoName} repository. Your job is to answer issues using documentation context retrieved from DeepWiki. Write in a warm, concise tone. Use markdown formatting. Always end with a note that you are an AI bot powered by DeepWiki + Groq, and invite the user to ask follow-up questions or add more details if needed. If the DeepWiki context does not cover the question well, say so honestly and suggest checking the official docs or pinging a maintainer.`
                    },
                    {
                      role: 'user',
                      content: `Issue Title: ${issueTitle}\n\nIssue Body:\n${issueBody || '(no body provided)'}\n\nDeepWiki context about this repo:\n${deepwikiAnswer || '(no context retrieved)'}\n\nPlease write a helpful GitHub issue comment answering this issue.`
                    }
                  ]
                })
              });

              const data = await res.json();
              if (data.error) throw new Error(`OpenAI error: ${JSON.stringify(data.error)}`);
              return data.choices?.[0]?.message?.content ?? '';
            }

            // ── 3. Post comment ─────────────────────────────────────────────
            try {
              const thinkingComment = await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issueNumber,
                body:         '🤖 _DeepWiki Bot is looking up the repository docs and preparing an answer…_'
              });

              const question = `${issueTitle}\n\n${issueBody}`.trim();

              let deepwikiContext = '';
              try {
                deepwikiContext = await askDeepWiki(repoOwner, repoName, question);
                console.log('DeepWiki context length:', deepwikiContext.length);
              } catch (err) {
                console.warn('DeepWiki fetch failed, continuing without context:', err.message);
              }

              const answer = await polishWithOpenAI(issueTitle, issueBody, deepwikiContext);

              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: thinkingComment.data.id,
                body:       answer
              });

              console.log(`Successfully answered issue #${issueNumber}`);
            } catch (err) {
              console.error('Bot error:', err);
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issueNumber,
                body: `🤖 _DeepWiki Bot encountered an error: \`${err.message}\`. A maintainer will follow up shortly._`
              });
              core.setFailed(err.message);
            }
