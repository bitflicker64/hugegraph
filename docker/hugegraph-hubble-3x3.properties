# This file REPLACES the image's /hubble/conf/hugegraph-hubble.properties
# wholesale — it is bind-mounted over it, not merged with it. Keys absent
# here therefore fall back to the code defaults in HubbleOptions, not to the
# values in the shipped conf file. That is deliberate for this stack (the
# defaults are correct for it), but it means a future Hubble release that
# changes a default, or adds a required option, changes this deployment
# without any diff to this file. Re-check against the shipped conf when
# upgrading Hubble.

server.host=0.0.0.0
server.port=8088

cluster=hg
idc=docker

pd.enabled=true
# Unused while pd.enabled=true: in PD mode Hubble picks a Server per request
# from PD-discovered addresses and never reads this value, so editing it has
# no effect on which replica is used. Kept only for the standalone fallback
# (pd.enabled=false).
server.direct_url=http://server0:8080
pd.peers=pd0:8686,pd1:8686,pd2:8686
# PD REST endpoint for the operations view (single address, no failover).
# If pd0 is down the cluster keeps quorum on pd1/pd2 but this view goes
# blind until you repoint this at a surviving PD.
pd.server=pd0:8620

operations.store.allowed_targets=[http://store0:8520,http://store1:8520,http://store2:8520]

# Dashboard is not part of this Compose stack.
dashboard.address=
