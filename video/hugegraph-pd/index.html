// ---------- scene 3: partitions ----------
const S3 = {};
(() => {
  const g = layers.partitions;
  const KEY = 'marko', CODE = calcHashcode(KEY), NP = 4;
  const X0 = 300, X1 = 1620, BY = 420;
  S3.part = Math.floor(CODE / (0x10000 / NP));
  S3.key = chip(g, `key "${KEY}"`, C.text, { size: 24 });
  S3.hash = box(g, { x: 760, y: 250, w: 250, h: 84, color: C.pd, label: '', size: 1, r: 14 });
  S3.hashT = tx(g, 760, 260, 'calcHashcode', { size: 26, family: MONO, fill: C.pd, weight: 600 });
  S3.code = chip(g, `0x${CODE.toString(16).toUpperCase().padStart(4, '0')}`, C.lead, { size: 24 });
  S3.bar = el('g', {}, g);
  S3.segs = [...Array(NP)].map((_, i) => el('rect', { x: 0, y: BY - 22, width: 0, height: 44, rx: 10,
    fill: C.pd, 'fill-opacity': 0.1, stroke: C.pd, 'stroke-width': 2 }, S3.bar));
  S3.segL = [...Array(NP)].map((_, i) => tx(S3.bar, 0, BY + 70, `P${i}`, { size: 26, family: MONO, weight: 600, fill: C.pd }));

  S3.l1 = tx(g, X1, BY - 44, '0xFFFF', { size: 22, family: MONO, fill: C.dim, anchor: 'end' });
  S3.bits = tx(g, 960, BY - 44, '16-bit code range', { size: 22, family: MONO, fill: C.dim });
  S3.marker = el('g', { opacity: 0 }, g);
  el('path', { d: 'M -12 -20 L 12 -20 L 0 0 Z', fill: C.lead }, S3.marker);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 44, stroke: C.lead, 'stroke-width': 3 }, S3.marker);
  S3.flow = line(g, 520, 250, 635, 250, { stroke: C.dim, w: 2 });
  S3.flow2 = line(g, 885, 250, 1000, 250, { stroke: C.dim, w: 2 });
  const sx = [560, 960, 1360];
  S3.stores = sx.map((x, i) => box(g, { x, y: 720, w: 340, h: 210, color: C.store, label: `Store ${i + 1}`, size: 26 }));
  S3.stores.forEach(b => set(b.lab, { y: 650 }));
  S3.leaderOf = [0, 1, 2, 0];
  S3.reps = [];
  for (let p = 0; p < NP; p++) for (let s = 0; s < 3; s++) {
    const c = chip(g, `P${p}`, C.pd, { size: 24, w: 108, h: 50 });
    const lc = chip(g, `P${p}`, C.lead, { size: 24, w: 108, h: 50, solid: true });
    S3.reps.push({ p, s, c, lc, tx: sx[s] - 66 + (p % 2) * 132, ty: 718 + Math.floor(p / 2) * 66 });
  }
  S3.legend = el('g', { opacity: 0 }, g);
  const lc = chip(S3.legend, 'leader', C.lead, { size: 20, solid: true });
  lc.at(1690, 690);
  const fc = chip(S3.legend, 'replica', C.pd, { size: 20 });
  fc.at(1690, 750);
  S3.segX = (i, gap) => {
    const w = (X1 - X0 - gap * (NP - 1)) / NP;
    return [X0 + i * (w + gap), w];
  };
  S3.render = t => {
    const s = SC.partitions;
    const tKey = s.start + 0.1, tHash = W('partitions', 'hashes'), tCode = W('partitions', '16-bit');
    const tSplit = W('partitions', 'splits'), tPlace = W('partitions', 'places'), tLead = W('partitions', 'leader');
    const kk = P(t, tKey, 0.6);
    S3.key.at(390, 250, kk, lerp(0.9, 1, kk));
    S3.hash.show(P(t, tKey + 0.2, 0.7));
    set(S3.hashT, { opacity: P(t, tKey + 0.5, 0.5) });
    drawLine(S3.flow, P(t, tHash - 0.2, 0.4));
    drawLine(S3.flow2, P(t, tCode - 0.3, 0.4));
    const kc = P(t, tCode - 0.2, 0.6, back);
    const codeX = X0 + (X1 - X0) * CODE / 0x10000;
    const kDrop = P(t, tCode + 0.5, 0.8, eio);
    S3.code.at(lerp(1120, codeX, kDrop), lerp(250, BY - 90, kDrop), clamp(kc * 1.2), lerp(0.8, 1, clamp(kc)));

    const kb = P(t, tCode - 0.1, 0.9, eio);
    const gap = 26 * P(t, tSplit - 0.1, 0.8, eio);

      const [x, w] = S3.segX(i, gap);
      const full = X1 - X0, start = X0 + full * 0, drawn = full * kb;
      const vis = clamp(X0 + drawn - x, 0, w);
      const hot = i === S3.part ? P(t, tSplit + 0.5, 0.5) : 0;
      set(S3.segs[i], { x, width: Math.max(0, vis), opacity: vis > 0 ? 1 : 0,
        'fill-opacity': 0.1 + 0.25 * hot, stroke: hot > 0.5 ? C.lead : C.pd });
      set(S3.segL[i], { x: x + w / 2, opacity: P(t, tSplit + i * 0.1, 0.5) });
    }
    [S3.l0, S3.l1, S3.bits].forEach(e => set(e, { opacity: kb }));
    set(S3.marker, { opacity: P(t, tCode + 1.1, 0.3), transform: `translate(${codeX} ${BY - 22})` });
    S3.stores.forEach((b, i) => b.show(P(t, tPlace - 0.6 + i * 0.1, 0.7), 0.05));
    S3.reps.forEach((r, n) => {
      const [x, w] = S3.segX(r.p, gap);
      const k = P(t, tPlace + 0.15 + r.p * 0.22 + r.s * 0.07, 0.9, eio);
      const fx = lerp(x + w / 2, r.tx, k), fy = lerp(BY, r.ty, k) - Math.sin(k * Math.PI) * 60;
      const isL = S3.leaderOf[r.p] === r.s;
      const kl = isL ? P(t, tLead - 0.15 + r.p * 0.08, 0.4) : 0;
      r.c.at(fx, fy, k > 0 ? clamp(k * 3) * (1 - kl) : 0, lerp(0.6, 1, k));
      r.lc.at(fx, fy, kl, 1 + 0.12 * Math.sin(clamp((t - tLead - r.p * 0.08) / 0.4) * Math.PI));
    });
    set(S3.legend, { opacity: P(t, tLead, 0.5) });
  };
})();

// ---------- scene 4: heartbeats ----------
const S4 = {};
(() => {
  const g = layers.heartbeats;
  const PD = [960, 300], sx = [470, 960, 1450], SY = 720;
  S4.ripples = [0, 1, 2].map(() => el('circle', { cx: PD[0], cy: PD[1], r: 0, fill: 'none', stroke: C.pd, 'stroke-width': 2 }, g));
  S4.links = sx.map(x => line(g, x, SY - 56, PD[0] + (x - 960) * 0.12, PD[1] + 86, { stroke: '#22404a', w: 2 }));
  S4.pd = el('circle', { cx: PD[0], cy: PD[1], r: 0, fill: C.pd, 'fill-opacity': 0.1, stroke: C.pd, 'stroke-width': 3 }, g);
  S4.pdT = tx(g, PD[0], PD[1] + 20, 'PD', { size: 56, weight: 800, fill: C.pd });
  S4.stores = sx.map((x, i) => box(g, { x, y: SY, w: 270, h: 112, color: C.store, label: `Store ${i + 1}`, sub: 'ONLINE', size: 30 }));
  S4.reg = sx.map(() => chip(g, 'RegisterStore', C.store, { size: 18 }));
  S4.ids = sx.map((_, i) => chip(g, `id ${i + 1}`, C.pd, { size: 18 }));
  S4.pulses = sx.map(() => [0, 1].map(() => el('circle', { r: 9, fill: C.store, opacity: 0 }, g)));
  S4.hbLabel = tx(g, 1700, 500, 'StoreHeartbeat', { size: 22, family: MONO, fill: C.store, anchor: 'end' });
  S4.instr = [['MovePartition', 0, 'move'], ['SplitPartition', 1, 'split'], ['TransferLeader', 2, 'transfer']]
    .map(([n, s, w]) => ({ c: chip(g, n, C.pd, { size: 20, solid: true }), s, w }));
  S4.stamp = el('g', { opacity: 0 }, g);
  el('rect', { x: -110, y: -30, width: 220, height: 60, rx: 8, fill: 'none', stroke: C.bad, 'stroke-width': 4 }, S4.stamp);
  tx(S4.stamp, 0, 12, 'OFFLINE', { size: 34, weight: 800, fill: C.bad, family: MONO, ls: 4 });
  S4.zz = tx(g, sx[2] + 120, SY - 86, '…', { size: 48, fill: C.dim, anchor: 'start' });
  const along = (i, k) => {
    const l = S4.links[i];
    const x1 = +l.getAttribute('x1'), y1 = +l.getAttribute('y1'), x2 = +l.getAttribute('x2'), y2 = +l.getAttribute('y2');
    return [lerp(x1, x2, k), lerp(y1, y2, k)];
  };
  S4.render = t => {
    const s = SC.heartbeats;
    const tReg = W('heartbeats', 'register'), tHb = W('heartbeats', 'heartbeats');
    const tIns = W('heartbeats', 'instructions'), tQuiet = W('heartbeats', 'quiet'), tOff = W('heartbeats', 'offline');
    const kpd = P(t, s.start + 0.05, 0.7, back);
    set(S4.pd, { r: 86 * kpd });
    set(S4.pdT, { opacity: P(t, s.start + 0.3, 0.4) });
    S4.stores.forEach((b, i) => b.show(P(t, s.start + 0.2 + i * 0.12, 0.7)));
    S4.links.forEach((l, i) => drawLine(l, P(t, tReg - 0.4 + i * 0.1, 0.5)));
    // registration: request up, id back down
    sx.forEach((x, i) => {
      const a = tReg + i * 0.18, k = P(t, a, 0.8, eio), kb = P(t, a + 0.9, 0.6, eio);
      const [ux, uy] = along(i, k);
      S4.reg[i].at(ux, uy, k > 0 && k < 1 ? 1 : 0);
      const [dx, dy] = along(i, 1 - kb);
      S4.ids[i].at(dx, dy, kb > 0 && kb < 1 ? 1 : 0);
    });
    // heartbeats: each store pulses up its link until it goes quiet
    const period = 1.05, travel = 0.62, stop = [Infinity, Infinity, tQuiet - 0.4];
    let lastArrive = [];
    sx.forEach((x, i) => {
      const first = tHb - 0.3 + i * 0.3;
      const n = Math.floor((t - first) / period);
      S4.pulses[i].forEach((d, j) => {
        const m = n - j, st = first + m * period;
        const k = (t - st) / travel;
        const ok = m >= 0 && st < stop[i] && k >= 0 && k <= 1;
        const [px, py] = along(i, eio(clamp(k)));
        set(d, { cx: px, cy: py, opacity: ok ? 1 - 0.3 * k : 0 });
        if (m >= 0 && st < stop[i] && t >= st + travel) lastArrive.push(st + travel);
      });
    });
    const arrivals = lastArrive.sort((a, b) => b - a).slice(0, 3);
    S4.ripples.forEach((r, j) => {
      const a = arrivals[j];
      const k = a === undefined ? 1 : clamp((t - a) / 0.8);
      set(r, { r: 86 + 60 * eo(k), opacity: (1 - k) * 0.7 * kpd });
    });
    set(S4.hbLabel, { opacity: P(t, tHb, 0.5) * (1 - P(t, tIns - 0.3, 0.4)) });
    // instructions travel down inside the heartbeat answer
    S4.instr.forEach(({ c, s: si, w }) => {
      const a = W('heartbeats', w) - 0.25, k = P(t, a, 0.9, eio);
      const [x, y] = along(si, 1 - k * 0.78);
      const fade = 1 - P(t, tQuiet - 0.2, 0.5);
      c.at(x, y, (k > 0 ? 1 : 0) * fade, lerp(0.7, 1, k));
    });
    const ko = P(t, tOff - 0.1, 0.35, back);
    const b3 = S4.stores[2];
    const dead = P(t, tQuiet, 0.8);
    set(b3.r, { stroke: dead > 0.5 ? C.bad : C.store, 'stroke-opacity': 1 - 0.4 * dead });
    b3.sub.textContent = ko > 0.3 ? 'OFFLINE' : 'ONLINE';
    set(b3.sub, { fill: ko > 0.3 ? C.bad : C.store });
    set(b3.lab, { opacity: 1 - 0.5 * dead });
    set(S4.links[2], { stroke: dead > 0.5 ? '#4a2526' : '#22404a' });
    set(S4.zz, { opacity: P(t, tQuiet - 0.1, 0.4) * (1 - ko) });
    set(S4.stamp, { opacity: clamp(ko), transform: `translate(${sx[2]} ${SY + 110}) rotate(-6) scale(${lerp(1.6, 1, clamp(ko))})` });
  };
})();

    const L = newLead ? 2 : 0;
    const kHalo = newLead ? P(t, tNew - 0.05, 0.5, back) : P(t, tThree, 0.5) * (1 - P(t, tFail, 0.3));
    set(S5.halo, { cx: N[L][0], cy: N[L][1], opacity: clamp(kHalo), r: 92 * lerp(0.8, 1, clamp(kHalo)) });

    S5.vote[0].at(lerp(N[2][0], N[1][0], kv), N[1][1] - 26, kv > 0 && kv < 1 ? 1 : 0);
    S5.vote[1].at(lerp(N[1][0], N[2][0], kr), N[1][1] + 26, kr > 0 && kr < 1 ? 1 : 0);
    set(S5.vote[1].t, { fill: C.store }); set(S5.vote[1].r, { stroke: C.store });
  };
})();

// ---------- scene 6: routing ----------
const S6 = {};
(() => {
  const g = layers.routing;
  const SV = [400, 520], PD = [960, 260], ST = [[1520, 360], [1520, 540], [1520, 720]];
  const PART = S3.part, LEAD = S3.leaderOf[PART];
  S6.ask = line(g, SV[0] + 140, SV[1] - 60, PD[0] - 130, PD[1] + 20, { stroke: '#3a3260', w: 2 });
  S6.data = el('line', { x1: SV[0] + 150, y1: SV[1] + 40, x2: ST[LEAD][0] - 150, y2: ST[LEAD][1], stroke: C.store,
    'stroke-width': 6, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, g);
  S6.packets = [...Array(6)].map(() => el('circle', { r: 7, fill: C.text, opacity: 0 }, g));
  S6.ctl = ST.map(([x, y]) => line(g, PD[0] + 120, PD[1] + 30, x - 150, y - 20, { stroke: '#1f3d44', w: 1.5, dash: '0.012 0.012' }));
  S6.server = box(g, { ...{ x: SV[0], y: SV[1], w: 300, h: 140 }, color: C.server, label: 'Server', sub: 'hstore backend' });
  S6.pd = box(g, { x: PD[0], y: PD[1], w: 260, h: 120, color: C.pd, label: 'PD', size: 44 });
  S6.stores = ST.map(([x, y], i) => box(g, { x, y, w: 300, h: 120, color: C.store, label: `Store ${i + 1}`, size: 30 }));
  S6.q = chip(g, 'where is key "marko"?', C.server, { size: 20 });
  S6.a = chip(g, `P${PART} · leader Store ${LEAD + 1}`, C.pd, { size: 20 });
  S6.cache = chip(g, `cache  P${PART} → Store ${LEAD + 1}`, C.lead, { size: 20 });
  S6.ctlL = tx(g, PD[0], PD[1] - 92, 'control plane', { size: 22, family: MONO, fill: C.dim });
  S6.dataL = tx(g, 960, 700, 'data path', { size: 24, family: MONO, fill: C.store, weight: 600 });
  S6.render = t => {
    const s = SC.routing;
    const tAsk = W('routing', 'ask'), tLives = W('routing', 'lives'), tCache = W('routing', 'cache');
    const tTalk = W('routing', 'talk'), tStays = W('routing', 'stays');
    S6.server.show(P(t, s.start + 0.05, 0.7));
    S6.pd.show(P(t, s.start + 0.2, 0.7), 0.09);
    S6.stores.forEach((b, i) => b.show(P(t, s.start + 0.3 + i * 0.1, 0.7)));
    S6.ctl.forEach((l, i) => drawLine(l, P(t, s.start + 0.6 + i * 0.1, 0.6)));
    drawLine(S6.ask, P(t, tAsk - 0.3, 0.5));
    const [ax, ay, bx, by] = [SV[0] + 140, SV[1] - 60, PD[0] - 130, PD[1] + 20];
    const kq = P(t, tAsk - 0.1, 0.9, eio);
    S6.q.at(lerp(ax, bx, kq), lerp(ay, by, kq) - 34, kq > 0 && kq < 1 ? 1 : 0);
    const ka = P(t, tLives + 0.1, 0.9, eio);
    S6.a.at(lerp(bx, ax, ka), lerp(by, ay, ka) + 34, ka > 0 && ka < 1 ? 1 : 0);
    const kc = P(t, tCache - 0.1, 0.5, back);
    S6.cache.at(SV[0], SV[1] + 120, clamp(kc), lerp(0.7, 1, clamp(kc)));
    const kd = P(t, tTalk - 0.2, 0.8, eio);
    set(S6.data, { 'stroke-dashoffset': 1 - kd, opacity: kd > 0 ? 0.85 : 0 });
    const x1 = SV[0] + 150, y1 = SV[1] + 40, x2 = ST[LEAD][0] - 150, y2 = ST[LEAD][1];
    S6.packets.forEach((p, j) => {
      const u = ((t - tTalk) * 0.55 + j / 6) % 1;
      set(p, { cx: lerp(x1, x2, u), cy: lerp(y1, y2, u), opacity: t > tTalk + 0.6 ? 0.9 * Math.sin(u * Math.PI) : 0 });
    });
    const s3 = S6.stores[LEAD];
    set(s3.r, { 'fill-opacity': 0.07 + 0.12 * P(t, tTalk + 0.4, 0.5) });
    const kq2 = P(t, tStays - 0.1, 0.6);
    set(S6.pd.g, { opacity: 1 - 0.55 * kq2 });
    S6.ctl.forEach(l => set(l, { opacity: 1 - 0.6 * kq2 }));
    set(S6.ask, { opacity: (S6.ask.getAttribute('opacity') > 0 ? 1 : 0) * (1 - 0.6 * kq2) });
    set(S6.ctlL, { opacity: kq2 });
    set(S6.dataL, { opacity: P(t, tStays + 0.3, 0.6) });
  };
})();

// ---------- captions ----------
const cap = document.getElementById('cap');
const capLines = [];
for (const s of TL.scenes) for (const l of s.lines) {
  const d = document.createElement('div');
  const spans = l.map((w, i) => {
    if (i) d.appendChild(document.createTextNode(' '));
    const sp = document.createElement('span');
    sp.textContent = w.t;
    d.appendChild(sp);
    return sp;
  });
  cap.appendChild(d);
  capLines.push({ d, spans, words: l, start: l[0].start, scene: s });
}
capLines.forEach((c, i) => {
  const next = capLines[i + 1];
  c.end = next && next.scene === c.scene ? next.start - 0.32 : c.scene.voiceEnd + 0.25;
});
function renderCaptions(t) {
  for (const c of capLines) {
    const kin = P(t, c.start - 0.15, 0.2), kout = P(t, c.end, 0.15);
    const op = kin * (1 - kout);
    c.d.style.opacity = op;
    c.d.style.transform = `translateY(${(1 - kin) * 14}px)`;
    if (op <= 0) continue;
    c.words.forEach((w, i) => {
      const said = t >= w.start, now = said && t < w.end + 0.05;
      c.spans[i].style.color = now ? C.pd : (said ? C.text : '#56616e');
    });
  }
}

// ---------- frame ----------
const SCENES = { intro: S1, roles: S2, partitions: S3, heartbeats: S4, raft: S5, routing: S6 };
const endEls = ['end1', 'end2', 'end3'].map(id => document.getElementById(id));
const introEls = [document.getElementById('title'), S1.tag, S1.tag2box];
function renderAt(t) {
  t = clamp(t, 0, TL.total);
  set(grid, { transform: `translate(${(t * 7) % 48} ${(t * 4) % 48})` });
  set(glowBg, { opacity: 0.7 + 0.3 * Math.sin(t * 0.8) });
  const endAt = TL.total - TL.outro;
  let cur = 0;
  TL.scenes.forEach((s, i) => {
    if (t >= s.start - 0.05) cur = i;
    const kin = i === 0 ? 1 : P(t, s.start - 0.3, 0.55, eio);
    const kout = i === TL.scenes.length - 1 ? P(t, endAt - 0.2, 0.5, eio) : P(t, s.end - 0.2, 0.45, eio);
    const op = kin * (1 - kout);
    set(layers[s.id], { opacity: op, transform: `translate(960 540) scale(${lerp(1.025, 1, kin) * lerp(1, 0.97, kout)}) translate(-960 -540)` });
    if (op > 0) SCENES[s.id].render(t);
  });
  const introOp = 1 - P(t, SC.intro.end - 0.2, 0.45, eio);
  introEls.forEach(e => { e.style.opacity = introOp; e.style.transform = `translateY(${-30 * (1 - introOp)}px)`; });
  const s = TL.scenes[cur];
  const hudK = cur === 0 ? P(t, SC.intro.end - 0.2, 0.5) : 1;
  const hudOut = 1 - P(t, endAt - 0.2, 0.5);
  set(hud, { opacity: hudK * hudOut });
  hudNum.textContent = `${String(cur + 1).padStart(2, '0')} / ${String(TL.scenes.length).padStart(2, '0')}`;
  hudName.textContent = s.title.toUpperCase();
  set(prog, { width: 1920 * t / TL.total });
  renderCaptions(t);
  endEls.forEach((e, i) => {
    const k = P(t, endAt + 0.1 + i * 0.18, 0.6);
    e.style.opacity = k;
    e.style.transform = `translateY(${(1 - k) * 24}px)`;
  });
}
window.renderAt = renderAt;
window.TL = TL;

// ---------- preview ----------
const q = new URLSearchParams(location.search);
document.fonts.ready.then(() => {
  if (q.has('play')) {
    const t0 = performance.now();
    const tick = () => { const t = (performance.now() - t0) / 1000; renderAt(t); if (t < TL.total) requestAnimationFrame(tick); };
    tick();
  } else {
    renderAt(parseFloat(q.get('t') || '0'));
  }
  window.READY = true;
});
</script>
</body>
</html>
