<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="620" fill="#ffffff"/>
  <line x1="650" y1="30" x2="650" y2="590" stroke="#cbd5e1" stroke-width="2"/>

  <!-- LEFT PANEL: today -->
  <text x="325" y="52" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Today: readiness is GET /versions</text>

  <rect x="40" y="120" width="140" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="149" text-anchor="middle" font-size="19" fill="#111111">kubelet</text>
  <text x="40" y="196" font-size="18" fill="#16a34a">answer: 200</text>
  <text x="40" y="220" font-size="18" fill="#16a34a">pod stays Ready</text>

  <rect x="450" y="140" width="160" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="530" y="182" text-anchor="middle" font-size="20" fill="#111111">Server</text>

  <rect x="40" y="290" width="140" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="319" text-anchor="middle" font-size="19" fill="#111111">client</text>
  <text x="40" y="368" font-size="18" fill="#dc2626">gets 500 after 30 s</text>
  <text x="40" y="392" font-size="18" fill="#dc2626">(#3204 request bound)</text>

  <rect x="245" y="290" width="140" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="315" y="319" text-anchor="middle" font-size="19" fill="#111111">Service</text>

  <rect x="450" y="430" width="160" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="530" y="461" text-anchor="middle" font-size="19" fill="#dc2626">Stores: 0 Up</text>

  <line x1="182" y1="143" x2="446" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <text x="240" y="128" font-size="18" fill="#111111">readiness: GET /versions</text>

  <line x1="182" y1="313" x2="243" y2="313" stroke="#475569" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <line x1="387" y1="303" x2="446" y2="205" stroke="#475569" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <text x="330" y="258" font-size="18" fill="#111111">GET /graph/vertices/&lt;id&gt;</text>

  <line x1="530" y1="212" x2="530" y2="426" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
  <text x="548" y="320" font-size="18" fill="#dc2626">no Store to call,</text>
  <text x="548" y="344" font-size="18" fill="#dc2626">waits out 30 s</text>

  <text x="325" y="545" text-anchor="middle" font-size="19" fill="#111111">The probe and the traffic disagree: the pod stays Ready</text>
  <text x="325" y="571" text-anchor="middle" font-size="19" fill="#111111">while every graph request fails.</text>

  <!-- RIGHT PANEL: proposed -->
  <text x="975" y="52" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Proposed: storage-aware readiness</text>

  <rect x="690" y="120" width="140" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="760" y="149" text-anchor="middle" font-size="19" fill="#111111">kubelet</text>
  <text x="690" y="196" font-size="18" fill="#d97706">answer: 503, no Store Up</text>
  <text x="690" y="220" font-size="18" fill="#d97706">pod turns NotReady</text>

  <rect x="1100" y="140" width="160" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="1180" y="182" text-anchor="middle" font-size="20" fill="#111111">Server</text>

  <rect x="690" y="290" width="140" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="760" y="319" text-anchor="middle" font-size="19" fill="#111111">client</text>
  <text x="690" y="368" font-size="18" fill="#16a34a">nothing routed to a</text>
  <text x="690" y="392" font-size="18" fill="#16a34a">Server that cannot serve</text>

  <rect x="895" y="290" width="140" height="46" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="965" y="319" text-anchor="middle" font-size="19" fill="#111111">Service</text>

  <rect x="1100" y="430" width="160" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1180" y="461" text-anchor="middle" font-size="19" fill="#dc2626">Stores: 0 Up</text>

  <line x1="832" y1="143" x2="1096" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <text x="860" y="128" font-size="18" fill="#111111">readiness: PD reachable + a Store Up</text>

  <line x1="832" y1="313" x2="893" y2="313" stroke="#475569" stroke-width="1.8" marker-end="url(#arrGray)"/>
  <line x1="1037" y1="303" x2="1096" y2="205" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5"/>
  <line x1="1052" y1="240" x2="1082" y2="270" stroke="#dc2626" stroke-width="3"/>
  <line x1="1082" y1="240" x2="1052" y2="270" stroke="#dc2626" stroke-width="3"/>
  <text x="900" y="258" font-size="18" fill="#111111">endpoint removed</text>

  <text x="975" y="545" text-anchor="middle" font-size="19" fill="#111111">Readiness follows storage, so a Server with no usable Store</text>
  <text x="975" y="571" text-anchor="middle" font-size="19" fill="#111111">leaves the Service, the same split #3185 gave PD.</text>
</svg>
