<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1300" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
  </defs>
  <text x="650" y="56" text-anchor="middle" font-size="40" font-weight="800" fill="#111111">PD REST auth today: the name is checked, the password is not</text>
  <text x="650" y="92" text-anchor="middle" font-size="20" fill="#555555">hg-pd-service RestAuthentication.preHandle and Authentication.authenticate, identical in 1.7.0 and master</text>

  <g fill="none" stroke="#333333" stroke-width="2">
    <rect x="40" y="250" width="180" height="76" rx="10"/>
    <rect x="290" y="250" width="200" height="76" rx="10"/>
    <rect x="560" y="250" width="200" height="76" rx="10"/>
    <rect x="830" y="250" width="200" height="76" rx="10"/>
    <line x1="220" y1="288" x2="288" y2="288" marker-end="url(#ar)"/>
    <line x1="490" y1="288" x2="558" y2="288" marker-end="url(#ar)"/>
    <line x1="760" y1="288" x2="828" y2="288" marker-end="url(#ar)"/>
    <path d="M390,250 C390,150 1060,150 1098,150" marker-end="url(#ar)"/>
    <line x1="1030" y1="288" x2="1098" y2="288" marker-end="url(#ar)"/>
    <path d="M1030,288 C1065,288 1065,430 1098,430" marker-end="url(#ar)"/>
  </g>
  <g fill="none" stroke="#c8341f" stroke-width="2.5" stroke-dasharray="7 5">
    <rect x="560" y="360" width="200" height="70" rx="10"/>
    <line x1="660" y1="326" x2="660" y2="358"/>
  </g>
  <g fill="#111111" text-anchor="middle" font-size="19" font-weight="700">
    <text x="130" y="282">request</text>
    <text x="390" y="282">header present?</text>
    <text x="660" y="282">split on ":"</text>
    <text x="930" y="282">name in set?</text>
  </g>
  <g fill="#555555" text-anchor="middle" font-size="16">
    <text x="130" y="308">Authorization: Basic</text>
    <text x="390" y="308">RestAuthentication</text>
    <text x="660" y="308">keep the left half only</text>
    <text x="930" y="308">hg store hubble vermeer</text>
  </g>
  <text x="660" y="390" text-anchor="middle" font-size="18" font-weight="700" fill="#c8341f">password</text>
  <text x="660" y="414" text-anchor="middle" font-size="15" fill="#c8341f">never read: the parse line is commented out</text>
  <g font-size="15" fill="#555555">
    <text x="470" y="140">no</text>
    <text x="1060" y="278">yes</text>
    <text x="1060" y="372">no</text>
  </g>

  <g fill="none" stroke="#c8341f" stroke-width="3"><rect x="1090" y="110" width="190" height="380" rx="12"/></g>
  <g fill="none" stroke="#333333" stroke-width="2">
    <rect x="1110" y="122" width="150" height="58" rx="8"/>
    <rect x="1110" y="260" width="150" height="58" rx="8"/>
    <rect x="1110" y="402" width="150" height="58" rx="8"/>
  </g>
  <g fill="#111111" text-anchor="middle" font-size="17" font-weight="700">
    <text x="1185" y="146">no header</text>
    <text x="1185" y="284">name matches</text>
    <text x="1185" y="426">name unknown</text>
  </g>
  <g fill="#555555" text-anchor="middle" font-size="14">
    <text x="1185" y="168">"Unauthorized!"</text>
    <text x="1185" y="306">real data returned</text>
    <text x="1185" y="448">"invalid service name"</text>
  </g>
  <text x="1185" y="520" text-anchor="middle" font-size="19" font-weight="800" fill="#c8341f">all three: HTTP 200</text>

  <rect x="150" y="556" width="1000" height="50" rx="10" fill="#f7d3cc" stroke="#d0432c" stroke-width="2.5"/>
  <text x="650" y="588" text-anchor="middle" font-size="21" font-weight="700" fill="#7a1f12">curl -u hg: with an empty password can DELETE /v1/store/{id} and POST /v1/members/change</text>
</svg>
